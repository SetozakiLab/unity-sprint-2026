<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="GitHub CLI認証の流れ">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4z" fill="#123b4f"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="28" fill="#f7f7f2"/>
  <g font-family="Hiragino Sans, Yu Gothic, sans-serif" font-weight="700">
    <g transform="translate(65 140)">
      <rect width="210" height="170" rx="18" fill="#1f2933"/>
      <circle cx="32" cy="30" r="7" fill="#f4a261"/>
      <circle cx="55" cy="30" r="7" fill="#e9c46a"/>
      <circle cx="78" cy="30" r="7" fill="#2a9d8f"/>
      <text x="30" y="86" font-size="26" fill="#ffffff">$ gh auth login</text>
      <text x="105" y="220" text-anchor="middle" font-size="26" fill="#123b4f">Terminal</text>
    </g>
    <g transform="translate(395 140)">
      <rect width="210" height="170" rx="18" fill="#ffffff" stroke="#d8dee4" stroke-width="4"/>
      <rect x="20" y="26" width="170" height="28" rx="14" fill="#d8dee4"/>
      <rect x="36" y="78" width="138" height="62" rx="12" fill="#457b9d"/>
      <text x="105" y="116" text-anchor="middle" font-size="26" fill="#ffffff">GitHub</text>
      <text x="105" y="220" text-anchor="middle" font-size="26" fill="#123b4f">Browser</text>
    </g>
    <g transform="translate(725 140)">
      <rect width="210" height="170" rx="18" fill="#ffffff" stroke="#167246" stroke-width="5"/>
      <path d="M60 92l32 32 62-78" fill="none" stroke="#167246" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="105" y="220" text-anchor="middle" font-size="26" fill="#123b4f">Authenticated</text>
    </g>
  </g>
  <g stroke="#123b4f" stroke-width="7" fill="none" marker-end="url(#arrow)">
    <path d="M290 225h84"/>
    <path d="M620 225h84"/>
  </g>
  <text x="500" y="430" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="34" font-weight="800" fill="#b45309">HTTPSを選んで、ブラウザで認証する</text>
</svg>
