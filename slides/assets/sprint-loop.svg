<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-label="まず動かす、作る、確認する、保存する流れ">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#263238" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="900" height="650" rx="36" fill="#f7f7f2"/>
  <circle cx="450" cy="325" r="210" fill="none" stroke="#d8dee4" stroke-width="28"/>
  <path d="M450 115a210 210 0 0 1 210 210" fill="none" stroke="#2a9d8f" stroke-width="28" stroke-linecap="round"/>
  <path d="M660 325a210 210 0 0 1-210 210" fill="none" stroke="#e9c46a" stroke-width="28" stroke-linecap="round"/>
  <path d="M450 535a210 210 0 0 1-210-210" fill="none" stroke="#f4a261" stroke-width="28" stroke-linecap="round"/>
  <path d="M240 325a210 210 0 0 1 210-210" fill="none" stroke="#457b9d" stroke-width="28" stroke-linecap="round"/>
  <polygon points="646,303 690,325 646,347" fill="#2a9d8f"/>
  <polygon points="472,521 450,565 428,521" fill="#e9c46a"/>
  <polygon points="254,347 210,325 254,303" fill="#f4a261"/>
  <polygon points="428,129 450,85 472,129" fill="#457b9d"/>
  <g filter="url(#shadow)" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-weight="700">
    <rect x="345" y="56" width="210" height="82" rx="18" fill="#ffffff"/>
    <text x="450" y="108" text-anchor="middle" font-size="30" fill="#123b4f">1. 入れる</text>
    <rect x="627" y="284" width="210" height="82" rx="18" fill="#ffffff"/>
    <text x="732" y="336" text-anchor="middle" font-size="30" fill="#123b4f">2. 開く</text>
    <rect x="345" y="512" width="210" height="82" rx="18" fill="#ffffff"/>
    <text x="450" y="564" text-anchor="middle" font-size="30" fill="#123b4f">3. 作る</text>
    <rect x="63" y="284" width="210" height="82" rx="18" fill="#ffffff"/>
    <text x="168" y="336" text-anchor="middle" font-size="30" fill="#123b4f">4. 保存</text>
  </g>
  <text x="450" y="300" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="34" font-weight="700" fill="#123b4f">今日の基本</text>
  <text x="450" y="350" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="42" font-weight="800" fill="#b45309">小さく回す</text>
